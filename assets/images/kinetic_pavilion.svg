<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern-2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8e5de" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#f8f7f4"/>
  <rect width="800" height="600" fill="url(#grid-pattern-2)"/>

  <!-- Technical Header -->
  <text x="40" y="50" font-family="'Courier New', monospace" font-size="11" fill="#7d7a72" letter-spacing="2">PROJECT 02 // PARAMETRIC KINEMATIC SECTION</text>
  <text x="760" y="50" font-family="'Courier New', monospace" font-size="11" fill="#7d7a72" text-anchor="end" letter-spacing="1">VENICE SPECIAL MENTION // 45°26'12"N 12°21'04"E</text>
  <line x1="40" y1="65" x2="760" y2="65" stroke="#d5d2c8" stroke-width="1"/>

  <!-- Main Kinematic Elevation & Structural Ribs -->
  <g transform="translate(400, 310)">
    <!-- Ground Datum Line -->
    <line x1="-340" y1="140" x2="340" y2="140" stroke="#181816" stroke-width="2"/>
    <line x1="-340" y1="146" x2="340" y2="146" stroke="#181816" stroke-width="0.5"/>
    <text x="-330" y="165" font-family="'Courier New', monospace" font-size="9" fill="#7d7a72">±0.00 FINISHED DECK LEVEL</text>

    <!-- Wind Flow Curves (Aerodynamic Simulation) -->
    <g stroke="#3a6073" stroke-width="1.2" fill="none" opacity="0.6">
      <path d="M -340,-60 Q -180,-140 0,-100 T 340,-180" stroke-dasharray="4,4"/>
      <path d="M -340,-30 Q -170,-110 0,-70 T 340,-140" stroke-dasharray="4,4"/>
      <path d="M -340,10 Q -160,-70 0,-30 T 340,-90" stroke-dasharray="4,4"/>
      <text x="-330" y="-70" font-family="'Courier New', monospace" font-size="9" fill="#3a6073">PREVAILING COASTAL DRAFT (18 KNOTS)</text>
    </g>

    <!-- Parametric Bent Larch Timber Ribs -->
    <!-- Primary Rib 1 -->
    <path d="M -220,140 C -200,-10 -60,-180 20,-160 C 120,-140 260,-40 240,140" fill="none" stroke="#252422" stroke-width="3.5"/>
    <!-- Primary Rib 2 (Offset Depth) -->
    <path d="M -180,140 C -160,10 -40,-150 40,-130 C 130,-115 220,-20 200,140" fill="none" stroke="#7a7061" stroke-width="2.5"/>
    <!-- Primary Rib 3 (Rear Counterweight) -->
    <path d="M -260,140 C -240,-30 -80,-210 0,-190 C 100,-170 280,-60 270,140" fill="none" stroke="#a39987" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Kinetic Shading Fins / Louvers at Dynamic Angles -->
    <g stroke="#8c6a50" stroke-width="2.5">
      <!-- Louver array adapting to sun angle -->
      <line x1="-160" y1="-30" x2="-130" y2="-65"/>
      <line x1="-130" y1="-65" x2="-95" y2="-100"/>
      <line x1="-95" y1="-100" x2="-55" y2="-125"/>
      <line x1="-55" y1="-125" x2="-10" y2="-140"/>
      <line x1="-10" y1="-140" x2="35" y2="-145"/>
      <line x1="35" y1="-145" x2="85" y2="-135"/>
      <line x1="85" y1="-135" x2="135" y2="-110"/>
      <line x1="135" y1="-110" x2="175" y2="-70"/>
      <line x1="175" y1="-70" x2="205" y2="-20"/>
    </g>

    <!-- Center Kinetic Actuator Node -->
    <circle cx="10" cy="-148" r="7" fill="#f8f7f4" stroke="#252422" stroke-width="2"/>
    <circle cx="10" cy="-148" r="3" fill="#a44a3f"/>
    <line x1="10" y1="-148" x2="60" y2="-210" stroke="#a44a3f" stroke-width="1"/>
    <text x="65" y="-212" font-family="'Courier New', monospace" font-size="9" fill="#a44a3f">SMA THERMAL MICRO-ACTUATOR (Δθ: +25°)</text>

    <!-- Structural Ground Foundations (Pinned Connections) -->
    <polygon points="-230,140 -210,140 -220,125" fill="#252422"/>
    <polygon points="230,140 250,140 240,125" fill="#252422"/>

    <!-- Human Figures Interacting with Scale -->
    <g stroke="#181816" stroke-width="1.2" fill="#181816">
      <!-- Visitor Looking Up -->
      <circle cx="-30" cy="80" r="3"/>
      <line x1="-30" y1="83" x2="-30" y2="110"/>
      <line x1="-30" y1="110" x2="-35" y2="140"/>
      <line x1="-30" y1="110" x2="-25" y2="140"/>
      <line x1="-30" y1="92" x2="-18" y2="82"/>

      <!-- Runner Crossing Threshold -->
      <circle cx="90" cy="80" r="3"/>
      <line x1="90" y1="83" x2="86" y2="108"/>
      <line x1="86" y1="108" x2="72" y2="128"/>
      <line x1="72" y1="128" x2="66" y2="140"/>
      <line x1="86" y1="108" x2="104" y2="125"/>
      <line x1="104" y1="125" x2="112" y2="140"/>
      <line x1="88" y1="92" x2="75" y2="98"/>
      <line x1="88" y1="92" x2="102" y2="85"/>
    </g>

    <!-- Dynamic Arc Angle Indicator -->
    <path d="M 100,-70 A 50,50 0 0,0 130,-40" fill="none" stroke="#252422" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="135" y="-55" font-family="'Courier New', monospace" font-size="8" fill="#252422">DILATION: 62°</text>
  </g>

  <!-- Technical Spec Footer -->
  <text x="40" y="560" font-family="'Courier New', monospace" font-size="10" fill="#99958c">MATERIAL: STEAM-BENT STEAMED LARCH & PTFE MEMBRANE</text>
  <text x="760" y="560" font-family="'Courier New', monospace" font-size="10" fill="#99958c" text-anchor="end">MAX CANTILEVER: 12.4 METERS</text>
</svg>
